asyncapi: 3.0.0
info:
  title: Uploads API
  version: 1.0.0
x-sunday-apiId: uploads
servers:
  api:
    host: api.example.com
    protocol: https
channels:
  images:
    address: /uploads/events
    messages:
      image:
        contentType: image/*
        headers:
          type: object
          required: [Content-Type]
          properties:
            Content-Type:
              $ref: '#/components/schemas/EventMediaType'
        payload:
          type: string
          format: binary
    bindings:
      http:
        type: request
        method: POST
  metadata:
    address: /uploads/metadata
    messages:
      envelope:
        contentType: application/json
        payload:
          $ref: '#/components/schemas/PngEnvelope'
    bindings:
      http:
        type: request
        method: POST
operations:
  putEvent:
    action: send
    channel:
      $ref: '#/channels/images'
    messages:
      - $ref: '#/channels/images/messages/image'
  putMetadata:
    action: send
    channel:
      $ref: '#/channels/metadata'
    messages:
      - $ref: '#/channels/metadata/messages/envelope'
components:
  schemas:
    EventMediaType:
      type: string
      enum: [image/png, image/jpeg]
    BaseEnvelope:
      type: object
      required: [contentType]
      properties:
        contentType:
          $ref: '#/components/schemas/EventMediaType'
    PngEnvelope:
      allOf:
        - $ref: '#/components/schemas/BaseEnvelope'
        - type: object
          properties:
            contentType: { type: string, const: image/png }
