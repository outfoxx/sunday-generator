openapi: 3.1.0
info: {title: Closed models, version: 1.0.0}
paths:
  /closed:
    post:
      operationId: acceptClosed
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClosedRecord'}
      responses:
        '204': {description: Accepted}
  /open:
    post:
      operationId: acceptOpen
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OpenRecord'}
      responses:
        '204': {description: Accepted}
components:
  schemas:
    ClosedRecord:
      type: object
      additionalProperties: false
      required: [display-name]
      properties:
        display-name: {type: string}
        nested: {$ref: '#/components/schemas/ClosedRecord'}
        child: {$ref: '#/components/schemas/ClosedChild'}
        empty: {$ref: '#/components/schemas/EmptyClosed'}
        choice: {$ref: '#/components/schemas/Choice'}
    OpenRecord:
      type: object
      properties:
        name: {type: string}
    ClosedChild:
      type: object
      additionalProperties: false
      allOf:
        - {$ref: '#/components/schemas/OpenRecord'}
      properties:
        name: {type: string}
        count: {type: integer}
    EmptyClosed:
      type: object
      additionalProperties: false
    Cat:
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind: {type: string, const: cat}
        name: {type: string}
    Dog:
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind: {type: string, const: dog}
        name: {type: string}
    Choice:
      oneOf:
        - {$ref: '#/components/schemas/Cat'}
        - {$ref: '#/components/schemas/Dog'}
      discriminator:
        propertyName: kind
        mapping:
          cat: '#/components/schemas/Cat'
          dog: '#/components/schemas/Dog'
