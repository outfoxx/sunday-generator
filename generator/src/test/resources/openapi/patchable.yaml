openapi: 3.1.0
info: {title: Patch Probe, version: '1.0'}
paths:
  /request:
    put:
      operationId: updateRequest
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/SomeRequest'}
      responses: {'204': {description: Updated}}
    patch:
      operationId: plainRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SomeRequest'}
      responses: {'204': {description: Updated}}
    post:
      operationId: createRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SomeRequest'}
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SomeRequest'}
components:
  schemas:
    Base:
      type: object
      required: [count]
      properties:
        count: {type: integer, minimum: 1, default: 5}
    SomeRequest:
      allOf:
        - {$ref: '#/components/schemas/Base'}
        - type: object
          required: [required-nullable, required-alias]
          properties:
            required-nullable: {type: [string, 'null'], minLength: 2}
            required-alias: {$ref: '#/components/schemas/NullableString'}
            optional-alias: {$ref: '#/components/schemas/NullableString'}
            title: {type: string, minLength: 2, default: initial}
            description: {type: [string, 'null']}
            state: {$ref: '#/components/schemas/State'}
            display-name: {type: string, minLength: 2}
    State:
      type: string
      enum: [active, unknown]
      x-unknown-value: unknown
    NullableString:
      type: [string, 'null']
      minLength: 2
