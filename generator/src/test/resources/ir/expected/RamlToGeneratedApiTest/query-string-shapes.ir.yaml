irVersion: "3"
name: "Query String Shapes API"
source:
  kind: "RAML"
  location: "SOURCE_LOCATION"
services:
- name: "QueryStringShapesService"
  ownerUris:
  - "SOURCE_LOCATION"
  operations:
  - id: "searchProjects"
    method: "GET"
    path: "/projects"
    queryString:
      kind: "NAMED"
      name: "SearchProjectsQueryString"
      scope:
        service: "QueryStringShapesService"
        operation: "searchProjects"
        usage: "QUERY_STRING"
      source:
        kind: "RAML"
        location: "SOURCE_LOCATION"
    responses:
    - status: 200
      type:
        kind: "NAMED"
        name: "SearchProjectsResponseBody"
        scope:
          service: "QueryStringShapesService"
          operation: "searchProjects"
          usage: "RESPONSE_BODY"
          status: 200
        source:
          kind: "RAML"
          location: "SOURCE_LOCATION"
      mediaTypes:
      - "application/json"
    auth:
      schemes:
      - "signed"
      requirements:
      - schemes:
        - "signed"
      securitySchemes:
      - name: "signed"
        type: "Pass Through"
        queryString:
          kind: "NAMED"
          name: "SignedQueryString"
          scope:
            securityScheme: "signed"
            usage: "SECURITY_QUERY_STRING"
          source:
            kind: "RAML"
            location: "SOURCE_LOCATION"
    media:
      request:
      - "application/json"
      response:
      - "application/json"
    declarationUri: "SOURCE_LOCATION#/~1projects/get"
  media:
    request:
    - "application/json"
    response:
    - "application/json"
models:
- name: "SearchProjectsQueryString"
  kind: "OBJECT"
  source:
    kind: "RAML"
    location: "SOURCE_LOCATION"
  declarationUri: "SOURCE_LOCATION#/~1projects/get/queryString"
  scope:
    service: "QueryStringShapesService"
    operation: "searchProjects"
    usage: "QUERY_STRING"
  properties:
  - name: "q"
    type:
      kind: "SCALAR"
      name: "string"
    required: true
  - name: "labels"
    type:
      kind: "ARRAY"
      name: "array"
      arguments:
      - kind: "SCALAR"
        name: "string"
  documentation:
    description: "Project search query object."
- name: "SearchProjectsResponseBody"
  kind: "OBJECT"
  source:
    kind: "RAML"
    location: "SOURCE_LOCATION"
  declarationUri: "SOURCE_LOCATION#/~1projects/get/responses/200/body/application~1json"
  scope:
    service: "QueryStringShapesService"
    operation: "searchProjects"
    usage: "RESPONSE_BODY"
    status: 200
  properties:
  - name: "total"
    type:
      kind: "SCALAR"
      name: "integer"
    required: true
- name: "SignedQueryString"
  kind: "OBJECT"
  source:
    kind: "RAML"
    location: "SOURCE_LOCATION"
  declarationUri: "SOURCE_LOCATION#/securitySchemes/signed/describedBy/queryString"
  scope:
    securityScheme: "signed"
    usage: "SECURITY_QUERY_STRING"
  properties:
  - name: "signature"
    type:
      kind: "SCALAR"
      name: "string"
    required: true
  - name: "expires"
    type:
      kind: "SCALAR"
      name: "integer"
    required: true
media:
  request:
  - "application/json"
  response:
  - "application/json"
placementConfiguration:
  defaults: {}
