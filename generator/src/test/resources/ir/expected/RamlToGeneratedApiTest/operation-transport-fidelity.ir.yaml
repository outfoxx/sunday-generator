irVersion: "3"
name: "Operation Transport Fidelity API"
source:
  kind: "RAML"
  location: "SOURCE_LOCATION"
services:
- name: "OperationTransportFidelityService"
  ownerUris:
  - "SOURCE_LOCATION"
  baseUri: "https://{region}.api.example.com/{version}"
  baseUriParameters:
  - name: "region"
    location: "PATH"
    type:
      kind: "SCALAR"
      name: "string"
    required: true
    defaultValue: "us"
  - name: "version"
    location: "PATH"
    type:
      kind: "SCALAR"
      name: "string"
    required: true
    defaultValue: "v1"
  operations:
  - id: "createProject"
    method: "POST"
    path: "/projects"
    parameters:
    - name: "include"
      location: "QUERY"
      type:
        kind: "SCALAR"
        name: "string"
    requestBody:
      type:
        kind: "NAMED"
        name: "ProjectCreateJson"
        source:
          kind: "RAML"
          location: "SOURCE_LOCATION"
      mediaTypes:
      - "application/json"
      payloads:
      - type:
          kind: "NAMED"
          name: "ProjectCreateJson"
          source:
            kind: "RAML"
            location: "SOURCE_LOCATION"
        mediaTypes:
        - "application/json"
      - type:
          kind: "NAMED"
          name: "ProjectCreatePatchPatch"
          source:
            kind: "RAML"
            location: "SOURCE_LOCATION"
        mediaTypes:
        - "application/merge-patch+json"
    responses:
    - status: 200
      type:
        kind: "NAMED"
        name: "Project"
        source:
          kind: "RAML"
          location: "SOURCE_LOCATION"
      mediaTypes:
      - "application/json"
      payloads:
      - type:
          kind: "NAMED"
          name: "Project"
          source:
            kind: "RAML"
            location: "SOURCE_LOCATION"
        mediaTypes:
        - "application/json"
      - type:
          kind: "NAMED"
          name: "ProjectSummary"
          source:
            kind: "RAML"
            location: "SOURCE_LOCATION"
        mediaTypes:
        - "application/vnd.project-summary+json"
    media:
      request:
      - "application/json"
      response:
      - "application/json"
    declarationUri: "SOURCE_LOCATION#/~1projects/post"
  media:
    request:
    - "application/json"
    response:
    - "application/json"
  servers:
  - url: "https://{region}.api.example.com/{version}"
    variables:
    - name: "region"
      location: "PATH"
      type:
        kind: "SCALAR"
        name: "string"
      required: true
      defaultValue: "us"
    - name: "version"
      location: "PATH"
      type:
        kind: "SCALAR"
        name: "string"
      required: true
      defaultValue: "v1"
    sourceUri: "SOURCE_LOCATION"
models:
- name: "Project"
  kind: "OBJECT"
  source:
    kind: "RAML"
    location: "SOURCE_LOCATION"
  declarationUri: "SOURCE_LOCATION#/types/Project"
  properties:
  - name: "id"
    type:
      kind: "SCALAR"
      name: "string"
    required: true
  - name: "name"
    type:
      kind: "SCALAR"
      name: "string"
    required: true
- name: "ProjectCreateJson"
  kind: "OBJECT"
  source:
    kind: "RAML"
    location: "SOURCE_LOCATION"
  declarationUri: "SOURCE_LOCATION#/types/ProjectCreateJson"
  properties:
  - name: "name"
    type:
      kind: "SCALAR"
      name: "string"
    required: true
- name: "ProjectCreatePatch"
  kind: "OBJECT"
  source:
    kind: "RAML"
    location: "SOURCE_LOCATION"
  declarationUri: "SOURCE_LOCATION#/types/ProjectCreatePatch"
  properties:
  - name: "name"
    type:
      kind: "SCALAR"
      name: "string"
- name: "ProjectSummary"
  kind: "OBJECT"
  source:
    kind: "RAML"
    location: "SOURCE_LOCATION"
  declarationUri: "SOURCE_LOCATION#/types/ProjectSummary"
  properties:
  - name: "id"
    type:
      kind: "SCALAR"
      name: "string"
    required: true
- name: "ProjectCreatePatchPatch"
  kind: "OBJECT"
  source:
    kind: "RAML"
    location: "SOURCE_LOCATION"
  declarationUri: "SOURCE_LOCATION#/types/ProjectCreatePatch"
  properties:
  - name: "name"
    type:
      kind: "SCALAR"
      name: "string"
      nullable: true
    patchDeletionAllowed: true
  patchable: true
  patchOf:
    kind: "NAMED"
    name: "ProjectCreatePatch"
media:
  request:
  - "application/json"
  response:
  - "application/json"
servers:
- url: "https://{region}.api.example.com/{version}"
  variables:
  - name: "region"
    location: "PATH"
    type:
      kind: "SCALAR"
      name: "string"
    required: true
    defaultValue: "us"
  - name: "version"
    location: "PATH"
    type:
      kind: "SCALAR"
      name: "string"
    required: true
    defaultValue: "v1"
  sourceUri: "SOURCE_LOCATION"
placementConfiguration:
  defaults: {}
