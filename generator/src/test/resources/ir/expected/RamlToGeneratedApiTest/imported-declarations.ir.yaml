irVersion: "3"
name: "Imported Declarations API"
source:
  kind: "RAML"
  location: "SOURCE_LOCATION"
services:
- name: "ImportedDeclarationsService"
  ownerUris:
  - "SOURCE_LOCATION"
  operations:
  - id: "fetchTest"
    method: "GET"
    path: "/tests/{id}"
    parameters:
    - name: "id"
      location: "PATH"
      type:
        kind: "SCALAR"
        name: "string"
      required: true
    responses:
    - status: 200
      type:
        kind: "NAMED"
        name: "Test"
        source:
          kind: "RAML"
          location: "SOURCE_LOCATION"
      mediaTypes:
      - "application/json"
    media:
      request:
      - "application/json"
      response:
      - "application/json"
    declarationUri: "SOURCE_LOCATION#/~1tests~1%7Bid%7D/get"
  media:
    request:
    - "application/json"
    response:
    - "application/json"
models:
- name: "Test"
  kind: "OBJECT"
  source:
    kind: "RAML"
    location: "SOURCE_LOCATION_REFERENCE"
  declarationUri: "SOURCE_LOCATION_REFERENCE#/types/Test"
  properties:
  - name: "libraryValue"
    type:
      kind: "SCALAR"
      name: "string"
    required: true
  placementScopes:
  - declarationUri: "SOURCE_LOCATION_REFERENCE"
    placement:
      kotlin:
        models:
          packageName: "io.example.library"
      swift:
        models:
          module: "LibraryModels"
      typescript:
        models:
          module: "library-models"
- name: "Test"
  kind: "OBJECT"
  source:
    kind: "RAML"
    location: "SOURCE_LOCATION"
  declarationUri: "SOURCE_LOCATION#/types/Test"
  properties:
  - name: "localValue"
    type:
      kind: "SCALAR"
      name: "string"
    required: true
  inherits:
  - kind: "NAMED"
    name: "Test"
    source:
      kind: "RAML"
      location: "SOURCE_LOCATION_REFERENCE"
media:
  request:
  - "application/json"
  response:
  - "application/json"
placementConfiguration:
  defaults: {}
