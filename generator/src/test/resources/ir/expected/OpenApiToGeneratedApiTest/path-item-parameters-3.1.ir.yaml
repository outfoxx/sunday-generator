irVersion: "3"
name: "Repo Path Parameters API"
source:
  kind: "OPENAPI"
  location: "SOURCE_LOCATION"
services:
- name: "RepoPathParametersService"
  ownerUris:
  - "SOURCE_LOCATION"
  baseUri: "https://api.example.com/v1"
  operations:
  - id: "getRepo"
    method: "GET"
    path: "/repos/{repoId}"
    parameters:
    - name: "repoId"
      location: "PATH"
      type:
        kind: "SCALAR"
        name: "string"
      required: true
      encoding:
        style: "simple"
    responses:
    - status: 200
      type:
        kind: "NAMED"
        name: "Repo"
      mediaTypes:
      - "application/json"
      documentation:
        description: "Repository response."
    media: {}
    declarationUri: "SOURCE_LOCATION#/paths/~1repos~1%7BrepoId%7D/get"
  - id: "getBranch"
    method: "GET"
    path: "/repos/{repoId}/branches/{branchId}"
    parameters:
    - name: "repoId"
      location: "PATH"
      type:
        kind: "SCALAR"
        name: "string"
      required: true
      encoding:
        style: "simple"
    - name: "branchId"
      location: "PATH"
      type:
        kind: "SCALAR"
        name: "string"
      required: true
      encoding:
        style: "simple"
    responses:
    - status: 200
      type:
        kind: "NAMED"
        name: "Branch"
      mediaTypes:
      - "application/json"
      documentation:
        description: "Branch response."
    media: {}
    declarationUri: "SOURCE_LOCATION#/paths/~1repos~1%7BrepoId%7D~1branches~1%7BbranchId%7D/get"
  media: {}
  servers:
  - url: "https://api.example.com/v1"
    sourceUri: "SOURCE_LOCATION"
models:
- name: "Branch"
  kind: "OBJECT"
  source:
    kind: "OPENAPI"
    location: "SOURCE_LOCATION"
  declarationUri: "SOURCE_LOCATION#/components/schemas/Branch"
  properties:
  - name: "branchId"
    type:
      kind: "SCALAR"
      name: "string"
    required: true
- name: "Repo"
  kind: "OBJECT"
  source:
    kind: "OPENAPI"
    location: "SOURCE_LOCATION"
  declarationUri: "SOURCE_LOCATION#/components/schemas/Repo"
  properties:
  - name: "repoId"
    type:
      kind: "SCALAR"
      name: "string"
    required: true
media: {}
servers:
- url: "https://api.example.com/v1"
  sourceUri: "SOURCE_LOCATION"
placementConfiguration:
  defaults: {}
