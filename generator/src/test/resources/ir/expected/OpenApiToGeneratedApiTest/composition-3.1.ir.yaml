irVersion: "3"
name: "Composition API"
source:
  kind: "OPENAPI"
  location: "SOURCE_LOCATION"
services:
- name: "CompositionService"
  ownerUris:
  - "SOURCE_LOCATION"
  baseUri: "https://api.example.com/v1"
  operations:
  - id: "getWorkItem"
    method: "GET"
    path: "/work-items/{itemId}"
    parameters:
    - name: "itemId"
      location: "PATH"
      type:
        kind: "SCALAR"
        name: "string"
      required: true
      encoding:
        style: "simple"
    responses:
    - status: 200
      type:
        kind: "NAMED"
        name: "WorkItem"
      mediaTypes:
      - "application/json"
      documentation:
        description: "Work item response."
    media: {}
    declarationUri: "SOURCE_LOCATION#/paths/~1work-items~1%7BitemId%7D/get"
  - id: "getActivity"
    method: "GET"
    path: "/activity"
    responses:
    - status: 200
      type:
        kind: "NAMED"
        name: "Activity"
      mediaTypes:
      - "application/json"
      documentation:
        description: "Activity response."
    media: {}
    declarationUri: "SOURCE_LOCATION#/paths/~1activity/get"
  - id: "getInlineActivity"
    method: "GET"
    path: "/activity/inline"
    responses:
    - status: 200
      type:
        kind: "NAMED"
        name: "GetInlineActivityResponseBody"
        scope:
          service: "CompositionService"
          operation: "getInlineActivity"
          usage: "RESPONSE_BODY"
          status: 200
      mediaTypes:
      - "application/json"
      documentation:
        description: "Inline activity response."
    media: {}
    declarationUri: "SOURCE_LOCATION#/paths/~1activity~1inline/get"
  media: {}
  servers:
  - url: "https://api.example.com/v1"
    sourceUri: "SOURCE_LOCATION"
models:
- name: "Activity"
  kind: "UNION"
  source:
    kind: "OPENAPI"
    location: "SOURCE_LOCATION"
  declarationUri: "SOURCE_LOCATION#/components/schemas/Activity"
  aliases:
  - kind: "NAMED"
    name: "Bug"
  - kind: "NAMED"
    name: "Feature"
  unionMode: "ONE_OF"
  discriminator: "kind"
  discriminatorMappings:
    bug:
      kind: "NAMED"
      name: "Bug"
    feature:
      kind: "NAMED"
      name: "Feature"
- name: "Bug"
  kind: "OBJECT"
  source:
    kind: "OPENAPI"
    location: "SOURCE_LOCATION"
  declarationUri: "SOURCE_LOCATION#/components/schemas/Bug"
  properties:
  - name: "severity"
    type:
      kind: "SCALAR"
      name: "string"
    required: true
  inherits:
  - kind: "NAMED"
    name: "WorkItem"
  discriminatorValue: "bug"
- name: "Feature"
  kind: "OBJECT"
  source:
    kind: "OPENAPI"
    location: "SOURCE_LOCATION"
  declarationUri: "SOURCE_LOCATION#/components/schemas/Feature"
  properties:
  - name: "rolloutStage"
    type:
      kind: "SCALAR"
      name: "string"
    required: true
    serializationName: "rollout-stage"
  inherits:
  - kind: "NAMED"
    name: "WorkItem"
  discriminatorValue: "feature"
- name: "GetInlineActivityResponseBody"
  kind: "UNION"
  source:
    kind: "OPENAPI"
    location: "SOURCE_LOCATION"
  declarationUri: "SOURCE_LOCATION#/paths/~1activity~1inline/get/responses/200/content/application~1json/schema"
  scope:
    service: "CompositionService"
    operation: "getInlineActivity"
    usage: "RESPONSE_BODY"
    status: 200
  aliases:
  - kind: "NAMED"
    name: "Bug"
  - kind: "NAMED"
    name: "Feature"
  unionMode: "ONE_OF"
- name: "WorkItem"
  kind: "OBJECT"
  source:
    kind: "OPENAPI"
    location: "SOURCE_LOCATION"
  declarationUri: "SOURCE_LOCATION#/components/schemas/WorkItem"
  properties:
  - name: "kind"
    type:
      kind: "SCALAR"
      name: "string"
    required: true
  - name: "id"
    type:
      kind: "SCALAR"
      name: "string"
    required: true
  discriminator: "kind"
  discriminatorMappings:
    bug:
      kind: "NAMED"
      name: "Bug"
    feature:
      kind: "NAMED"
      name: "Feature"
media: {}
servers:
- url: "https://api.example.com/v1"
  sourceUri: "SOURCE_LOCATION"
placementConfiguration:
  defaults: {}
