name: Recover beta.52 publication

on:
  push:
    branches: [codex/recover-beta52]
    paths: [.github/workflows/recover-beta52.yml]

permissions:
  contents: write

concurrency:
  group: publish-release-2.0.0-beta.52
  cancel-in-progress: false

jobs:

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
      with:
        ref: c175ab15f875f009f288393ff6e9bb74732f3ebb

    - uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: temurin

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Git Short SHA
      run: |
        calculatedSha=$(git rev-parse --short HEAD)
        echo "GIT_COMMIT_SHA=$calculatedSha" >> "$GITHUB_ENV"

    - name: Verify Maven Availability
      timeout-minutes: 20
      env:
        RELEASE_VERSION: 2.0.0-beta.52
      run: python3 scripts/ci/wait_for_maven_release.py "$RELEASE_VERSION"

    - name: Inventory existing beta.52 publications
      id: existing
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python3 - <<'PYCODE'
        import os, urllib.request, urllib.error
        version = '2.0.0-beta.52'
        urls = {
            'plugin': f'https://plugins.gradle.org/m2/io/outfoxx/sunday-generator/io.outfoxx.sunday-generator.gradle.plugin/{version}/io.outfoxx.sunday-generator.gradle.plugin-{version}.pom',
            'docker': f'https://hub.docker.com/v2/repositories/outfoxx/sunday-generator/tags/{version}',
            'docs': f'https://outfoxx.github.io/sunday-generator/{version}/index.html',
            'github': f'https://api.github.com/repos/outfoxx/sunday-generator/releases/tags/{version}',
        }
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            for name, url in urls.items():
                headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN']} if name == 'github' else {}
                try:
                    with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                        exists = response.status == 200
                        if not exists:
                            raise RuntimeError(f'{name}: unexpected HTTP {response.status}')
                except urllib.error.HTTPError as error:
                    if error.code != 404:
                        raise
                    exists = False
                print(f'{name}: already published={exists}')
                output.write(f'{name}={str(exists).lower()}\n')
        PYCODE

    - name: Build Artifacts & Documentation
      run: >-
        ./gradlew
        -PreleaseVersion=2.0.0-beta.52
        build :dokkaGenerate
        -x test
      env:
        GIT_COMMIT_SHA: ${{ env.GIT_COMMIT_SHA }}

    - name: Publish Plugin Release
      if: steps.existing.outputs.plugin == 'false'
      run: >-
        ./gradlew
        -PreleaseVersion=2.0.0-beta.52
        -Pgradle.publish.key=${{ secrets.GRADLE_PUBLISH_KEY }} -Pgradle.publish.secret=${{ secrets.GRADLE_PUBLISH_SECRET }}
        publishPlugins -x test
      env:
        ORG_GRADLE_PROJECT_signingKeyId: ${{ secrets.OSSRH_GPG_SECRET_KEY_ID }}
        ORG_GRADLE_PROJECT_signingKey: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
        ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}

    - name: Publish Docker
      if: steps.existing.outputs.docker == 'false'
      run: >-
        ./gradlew
        -PreleaseVersion=2.0.0-beta.52
        --continue
        -Djib.to.auth.username=${{ secrets.DOCKER_PUBLISH_USER }}
        -Djib.to.auth.password=${{ secrets.DOCKER_PUBLISH_TOKEN }}
        build
        jib
        -x test

    - name: Publish Documentation
      if: steps.existing.outputs.docs == 'false'
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages
        clean: false
        folder: build/dokka

    - name: Publish GitHub Release
      if: steps.existing.outputs.github == 'false'
      run: >-
        ./gradlew
        -PreleaseVersion=2.0.0-beta.52
        -Pgithub.token=${{ secrets.GITHUB_TOKEN }}
        githubRelease
        -x test
      env:
        ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_CENTRAL_USERNAME }}
        ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_CENTRAL_PASSWORD }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.OSSRH_GPG_SECRET_KEY_ID }}
        ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
