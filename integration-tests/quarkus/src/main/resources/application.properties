# Fixed test identities; source bearer metadata does not select an authentication mechanism.
quarkus.http.auth.basic=true
# Generated resource annotations select native authentication after routing.
quarkus.http.auth.proactive=false
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.alice=test-password
quarkus.security.users.embedded.roles.alice=user
quarkus.http.test-port=0

# Keep existing unannotated fixtures independent of the Zanzibar-specific endpoints.
quarkus.zanzibar.filter.deny-unannotated-resource-methods=false
mp.jwt.verify.issuer=https://issuer.test
mp.jwt.verify.publickey.location=public-key.pem

# Deliberately incompatible early authentication: endpoint selection must reject it visibly.
quarkus.http.auth.permission.early.paths=/documents/early/*
quarkus.http.auth.permission.early.policy=authenticated
quarkus.http.auth.permission.early.auth-mechanism=basic
