# Fixed test identities; source bearer metadata does not select an authentication mechanism.
quarkus.http.auth.basic=true
# Scheme-aware endpoints perform their own authentication; generic endpoints still request a framework identity.
quarkus.http.auth.proactive=false
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.alice=test-password
quarkus.security.users.embedded.roles.alice=user
quarkus.http.test-port=0
