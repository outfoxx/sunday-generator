openapi: 3.1.0
info: {title: Native payload validation, version: 1.0.0}
paths:
  /native/collection-defaults:
    get:
      operationId: collectionDefaults
      parameters:
        - {name: projectId, in: query, style: form, explode: true, schema: {type: array, items: {type: string}, default: []}}
        - {name: category, in: query, style: form, explode: true, schema: {type: array, items: {type: string}, default: [general]}}
      responses:
        '200':
          description: Resolved collection parameters
          content:
            application/json: {schema: {type: array, items: {type: string}}}
  /native/defaults/{pathValue}:
    get:
      operationId: defaultParameters
      parameters:
        - {name: pathValue, in: path, required: true, schema: {type: string, default: fallback}}
        - {name: queryValue, in: query, required: true, schema: {type: integer, minimum: 1, default: 5}}
        - {name: headerValue, in: header, required: true, schema: {type: string, default: header}}
        - {name: cookieValue, in: cookie, required: true, schema: {type: string, default: cookie}}
      responses:
        '200':
          description: Resolved parameters
          content:
            application/json: {schema: {type: array, items: {type: string}}}
  /native/codes:
    post:
      operationId: codes
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/Codes'}}
      responses:
        '200':
          description: Validated codes
          content:
            application/json: {schema: {$ref: '#/components/schemas/Codes'}}
  /native/states:
    post:
      operationId: states
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/States'}}
      responses:
        '200':
          description: Tolerant states
          content:
            application/json: {schema: {$ref: '#/components/schemas/States'}}
  /native/parameters/{pathState}:
    get:
      operationId: parameters
      parameters:
        - {name: pathState, in: path, required: true, schema: {$ref: '#/components/schemas/State'}}
        - {name: queryStates, in: query, schema: {type: array, items: {$ref: '#/components/schemas/State'}}}
        - {name: headerState, in: header, schema: {$ref: '#/components/schemas/State'}}
        - {name: cookieState, in: cookie, schema: {$ref: '#/components/schemas/State'}}
        - {name: openState, in: query, schema: {$ref: '#/components/schemas/OpenState'}}
      responses:
        '200':
          description: Parameters accepted
          content:
            application/json: {schema: {$ref: '#/components/schemas/States'}}
components:
  schemas:
    Code: {type: string, pattern: '^[A-Z]{2}$'}
    Codes: {type: array, minItems: 2, items: {$ref: '#/components/schemas/Code'}}
    State:
      type: string
      enum: [ready, unknown]
      x-unknown-value: unknown
      x-sunday-tolerance: response
    States: {type: array, minItems: 1, items: {$ref: '#/components/schemas/State'}}
    OpenState:
      type: string
      enum: [ready, unknown]
      x-unknown-value: unknown
      x-sunday-tolerance: all
