openapi: 3.1.0
info: {title: first security, version: 1.0.0}
security: [{bearer: [read]}]
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      x-sunday-security:
        server:
          provider: shared
          quarkus: {mode: provider}
x-sunday-zanzibar:
  user-source:
    jwt: {claims: [sub], principal-fallback: false}
paths:
  /first/protected:
    get:
      operationId: protectedCall
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema: {type: string}
  /first/public:
    get:
      operationId: publicCall
      security: []
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema: {type: string}
  /first/documents/{documentId}:
    get:
      operationId: document
      x-sunday-zanzibar: {objectType: document, pathParam: documentId, relation: viewer, userType: user}
      parameters:
        - {name: documentId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema: {type: string}
