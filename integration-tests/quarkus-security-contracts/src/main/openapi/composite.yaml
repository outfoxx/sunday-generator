openapi: 3.1.0
info: {title: composite security, version: 1.0.0}
security: [{bearer: [read], key: []}]
components:
  securitySchemes:
    key:
      type: apiKey
      in: header
      name: X-Service-Key
      x-sunday-security:
        server:
          provider: key
          quarkus: {mode: provider}
    bearer:
      type: http
      scheme: bearer
      x-sunday-security:
        server:
          provider: shared
          quarkus: {mode: provider}
x-sunday-zanzibar:
  user-source:
    jwt: {claims: [sub], principal-fallback: false}
paths:
  /composite/protected:
    get:
      operationId: protectedCall
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema: {type: string}
  /composite/public:
    get:
      operationId: publicCall
      security: []
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema: {type: string}
  /composite/documents/{documentId}:
    get:
      operationId: document
      x-sunday-zanzibar: {objectType: document, pathParam: documentId, relation: viewer, userType: user}
      parameters:
        - {name: documentId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema: {type: string}
  /composite/alternative:
    get:
      operationId: alternative
      security: [{bearer: [read]}, {key: []}]
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema: {type: string}
