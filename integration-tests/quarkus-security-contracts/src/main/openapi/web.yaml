openapi: 3.1.0
info: {title: web security, version: 1.0.0}
security: [{bearer: [read]}]
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      x-sunday-security:
        server:
          provider: shared
          quarkus:
            mode: webApp
            tenant: browser
            properties:
              auth-server-url: ${fixture.idp.url}/browser
              token.issuer: https://issuer.test
              token.audience: browser-app
              token.refresh-expired: true
              token.lifespan-grace: 0
paths:
  /web/protected:
    get:
      operationId: protectedCall
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema: {type: string}
  /web/public:
    get:
      operationId: publicCall
      security: []
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema: {type: string}
