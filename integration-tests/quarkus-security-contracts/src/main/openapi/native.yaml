openapi: 3.1.0
info: {title: native security, version: 1.0.0}
security: [{bearer: [read]}]
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      x-sunday-security:
        server:
          provider: shared
          quarkus:
            mode: oidc
            properties:
              token.issuer: https://issuer.test
              token.audience: integration
x-sunday-quarkus-config:
  server:
    properties:
      quarkus.zanzibar.filter.deny-unannotated-resource-methods: false
x-sunday-zanzibar:
  user-source:
    jwt: {claims: [sub], principal-fallback: false}
paths:
  /native/protected:
    get:
      operationId: protectedCall
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema: {type: string}
  /native/public:
    get:
      operationId: publicCall
      security: []
      x-sunday-zanzibar: {ignore: true}
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema: {type: string}
  /native/documents/{documentId}:
    get:
      operationId: document
      x-sunday-zanzibar: {objectType: document, pathParam: documentId, relation: viewer, userType: user}
      parameters:
        - {name: documentId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema: {type: string}

  /native/unannotated:
    get:
      operationId: unannotated
      security: []
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema: {type: string}
